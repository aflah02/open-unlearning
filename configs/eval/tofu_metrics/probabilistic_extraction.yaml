# @package eval.tofu.metrics.probabilistic_extraction
defaults:
  - ../../data/datasets@datasets: TOFU_QA_forget
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: probabilistic_extraction
batch_size: ${eval.tofu.batch_size}

# (n, p)-discoverable extraction parameters
num_queries: 100
probability_threshold: 0.5

# Decoder g_phi. The paper's primary setting is top-k with k=40 and T=1.
temperature: 1.0
top_k: 40
top_p: null

datasets:
  TOFU_QA_forget:
    args:
      hf_args:
        name: ${eval.tofu.forget_split}_perturbed
      question_key: ${eval.tofu.question_key}
