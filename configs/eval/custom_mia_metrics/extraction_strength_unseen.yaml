# @package eval.custom_mia.metrics.extraction_strength_unseen
defaults:
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: extraction_strength
batch_size: 8

datasets:
  unseen:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "${mia_data_root}/${mia_corpus}/unseen.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: ${mia_max_length}
