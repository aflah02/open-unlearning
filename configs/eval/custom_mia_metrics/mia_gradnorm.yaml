# @package eval.custom_mia.metrics.mia_gradnorm
defaults:
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: mia_gradnorm
batch_size: 1
p: 2  # L2 norm, adjust as needed

datasets:
  forget:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "${mia_data_root}/${mia_corpus}/members.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: ${mia_max_length}
  holdout:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "${mia_data_root}/${mia_corpus}/unseen.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: ${mia_max_length}
