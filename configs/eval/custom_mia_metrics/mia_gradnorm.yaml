# @package eval.custom_mia.metrics.mia_gradnorm
defaults:
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: mia_gradnorm
batch_size: 8
p: 2  # L2 norm, adjust as needed

datasets:
  forget:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "/NS/llm-pretraining/work/afkhan/HubbleSuite/seen.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: 512
  holdout:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "/NS/llm-pretraining/work/afkhan/HubbleSuite/holdout.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: 512