# @package eval.custom_mia.metrics.mia_zlib
defaults:
  - ../../collator@collators: DataCollatorForSupervisedDatasetwithIndex

handler: mia_zlib
batch_size: 8

datasets:
  forget:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "${mia_data_root}/${mia_corpus}/members.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: 512
  holdout:
    handler: CompletionDataset
    args:
      hf_args:
        path: json
        data_files: "${mia_data_root}/${mia_corpus}/unseen.jsonl"
        trust_remote_code: true
        split: "train"
      max_length: 512
