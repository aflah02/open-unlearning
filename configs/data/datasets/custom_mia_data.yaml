# @package _global_
forget:
  handler: CompletionDataset
  access_key: forget
  args:
    hf_args:
      path: json
      data_files: "${mia_data_root}/${mia_corpus}/members.jsonl"
      trust_remote_code: true
    split: null
    max_length: 512
holdout:
  handler: CompletionDataset
  access_key: holdout
  args:
    hf_args:
      path: json
      data_files: "${mia_data_root}/${mia_corpus}/unseen.jsonl"
      trust_remote_code: true
    split: null
    max_length: 512
