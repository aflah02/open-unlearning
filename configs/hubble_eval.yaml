# @package _global_

defaults:
  - _self_
  - model: Llama-3.2-1B-Instruct
  - eval: tofu
  - paths: default
  - hydra: eval
  - experiment: null

model:
  model_args:
    device_map: cuda

experiment: eval/tofu/llama2
mode: eval
task_name: SAMPLE_EVAL
seed: 0

# Override the eval.tofu defaults to include MIA attacks
eval:
  tofu:
    defaults:
      - tofu_metrics:
        - forget_quality
        - forget_Q_A_Prob
        - forget_Q_A_ROUGE
        - model_utility
        - privleak
        - extraction_strength
        # MIA attacks (all except reference)
        - mia_loss
        - mia_min_k
        - mia_min_k_plus_plus
        - mia_zlib
        - mia_gradnorm
        # Reference attack excluded as requested
        # - mia_reference