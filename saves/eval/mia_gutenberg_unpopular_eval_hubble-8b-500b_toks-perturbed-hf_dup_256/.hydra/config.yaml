model:
  model_args:
    device_map: cuda
    pretrained_model_name_or_path: allegrolab/hubble-8b-500b_toks-perturbed-hf
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: allegrolab/hubble-8b-500b_toks-perturbed-hf
  template_args:
    apply_chat_template: false
    user_start_tag: ''
    user_end_tag: ''
    asst_start_tag: ''
    asst_end_tag: ''
mode: eval
task_name: mia_gutenberg_unpopular_eval_hubble-8b-500b_toks-perturbed-hf_dup_256
seed: 0
eval:
  mia_gutenberg_unpopular:
    metrics:
      mia_loss:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_loss
        batch_size: 8
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_train_dup_256.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
      mia_min_k:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_min_k
        batch_size: 8
        k: 40
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_train_dup_256.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
      mia_min_k_plus_plus:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_min_k_plus_plus
        batch_size: 8
        k: 40
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_train_dup_256.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
      mia_zlib:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_zlib
        batch_size: 8
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_train_dup_256.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/gutenberg_unpopular_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 10000
    handler: TOFUEvaluator
    output_dir: ${paths.output_dir}
    overwrite: false
    batch_size: 32
paths:
  root_dir: .
  data_dir: ${paths.root_dir}/data/
  datasets: ${paths.root_dir}/configs/data/datasets
  output_dir: saves/eval/${task_name}
  work_dir: ${hydra:runtime.cwd}
