hydra:
  run:
    dir: ${paths.output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/eval.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - experiment=eval/mia_yago_biographies/default
    - model=hubble-1b-500b_toks-standard-hf
    - task_name=mia_yago_biographies_eval_hubble-1b-500b_toks-standard-hf_dup_256
    - eval.mia_yago_biographies.metrics.mia_loss.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl
    - eval.mia_yago_biographies.metrics.mia_min_k.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl
    - eval.mia_yago_biographies.metrics.mia_min_k_plus_plus.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl
    - eval.mia_yago_biographies.metrics.mia_zlib.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl
  job:
    name: eval
    chdir: null
    override_dirname: eval.mia_yago_biographies.metrics.mia_loss.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl,eval.mia_yago_biographies.metrics.mia_min_k.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl,eval.mia_yago_biographies.metrics.mia_min_k_plus_plus.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl,eval.mia_yago_biographies.metrics.mia_zlib.datasets.forget.args.hf_args.data_files=/NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/biographies_yago_train_dup_256.jsonl,experiment=eval/mia_yago_biographies/default,model=hubble-1b-500b_toks-standard-hf,task_name=mia_yago_biographies_eval_hubble-1b-500b_toks-standard-hf_dup_256
    id: ???
    num: ???
    config_name: eval.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.0
    version_base: '1.3'
    cwd: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/saves/eval/mia_yago_biographies_eval_hubble-1b-500b_toks-standard-hf_dup_256
    choices:
      experiment: eval/mia_yago_biographies/default
      hydra: eval
      paths: default
      eval: mia_yago_biographies
      eval/mia_yago_biographies_metrics/../../collator@eval.mia_yago_biographies.metrics.mia_zlib.collators: DataCollatorForSupervisedDatasetwithIndex
      eval/mia_yago_biographies_metrics/../../collator@eval.mia_yago_biographies.metrics.mia_min_k_plus_plus.collators: DataCollatorForSupervisedDatasetwithIndex
      eval/mia_yago_biographies_metrics/../../collator@eval.mia_yago_biographies.metrics.mia_min_k.collators: DataCollatorForSupervisedDatasetwithIndex
      eval/mia_yago_biographies_metrics/../../collator@eval.mia_yago_biographies.metrics.mia_loss.collators: DataCollatorForSupervisedDatasetwithIndex
      model: hubble-1b-500b_toks-standard-hf
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
