model:
  model_args:
    device_map: cuda
    pretrained_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
    attn_implementation: flash_attention_2
    torch_dtype: bfloat16
  tokenizer_args:
    pretrained_model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
  template_args:
    apply_chat_template: true
    system_prompt: You are a helpful assistant.
    system_prompt_with_special_tokens: '<|begin_of_text|><|start_header_id|>system<|end_header_id|>


      You are a helpful assistant.<|eot_id|>'
    user_start_tag: '<|start_header_id|>user<|end_header_id|>


      '
    user_end_tag: <|eot_id|>
    asst_start_tag: '<|start_header_id|>assistant<|end_header_id|>


      '
    asst_end_tag: <|eot_id|>
    date_string: 10 Apr 2025
mode: eval
task_name: mia_passage_wikipedia_eval_Llama-3.2-1B-Instruct
seed: 0
eval:
  mia_passage_wikipedia:
    metrics:
      mia_loss:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_loss
        batch_size: 8
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_train.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
      mia_min_k:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_min_k
        batch_size: 8
        k: 40
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_train.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
      mia_min_k_plus_plus:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_min_k_plus_plus
        batch_size: 8
        k: 40
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_train.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
      mia_zlib:
        collators:
          DataCollatorForSupervisedDataset:
            handler: DataCollatorForSupervisedDataset
            args:
              padding_side: right
              index: index
        handler: mia_zlib
        batch_size: 8
        datasets:
          forget:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_train.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
          holdout:
            handler: CompletionDataset
            args:
              hf_args:
                path: json
                data_files: /NS/llm-pretraining/work/afkhan/HubbleSuite/open-unlearning/Hubble_Data/passages_wikipedia_test.jsonl
                trust_remote_code: true
                split: train
              max_length: 512
    handler: TOFUEvaluator
    output_dir: ${paths.output_dir}
    overwrite: false
    batch_size: 32
paths:
  root_dir: .
  data_dir: ${paths.root_dir}/data/
  datasets: ${paths.root_dir}/configs/data/datasets
  output_dir: saves/eval/${task_name}
  work_dir: ${hydra:runtime.cwd}
